<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Drives</title>
</head>
<body>
    <h1>Select an Available Drive</h1>
    <select id="drive-dropdown">
        <option value="" disabled selected>Select a drive</option>
    </select>
    <script>
        // Function to detect available drives
        function getAvailableDrives() {
            let drives = ['C:', 'D:', 'E:']; // Example drives
            let dropdown = document.getElementById('drive-dropdown');

            drives.forEach(drive => {
                let option = document.createElement('option');
                option.value = drive;
                option.textContent = drive;
                dropdown.appendChild(option);
            });
        }

        // Validate selected drive
        function validateDrive() {
            let dropdown = document.getElementById('drive-dropdown');
            let selectedDrive = dropdown.value;
            if (selectedDrive) {
                alert('You selected: ' + selectedDrive);
            } else {
                alert('Please select a drive!');
            }
        }

        // Initialize drive detection
        getAvailableDrives();
        document.getElementById('drive-dropdown').addEventListener('change', validateDrive);
    </script>
</body>
</html>
