<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DriveGuard - Removable Drive Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root {
        --primary: #1e40af;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #e0e7ff);
        color: #1e2937;
        min-height: 100vh;
        padding: 20px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: hidden;
        margin-bottom: 20px;
    }
    .header {
        background: var(--primary);
        color: white;
        padding: 1.4rem 1.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header h1 { font-size: 1.4rem; font-weight: 600; }

    .tab-bar {
        display: flex;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
    }
    .tab {
        padding: 14px 28px;
        font-weight: 600;
        cursor: pointer;
        border-bottom: 3px solid transparent;
    }
    .tab.active {
        border-bottom-color: var(--primary);
        color: var(--primary);
        background: white;
    }

    .content { padding: 1.8rem; }

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn:hover { transform: translateY(-1px); }

    .drive-list { margin: 12px 0; }
    .drive-item {
        display: flex;
        align-items: center;
        padding: 14px 18px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        margin-bottom: 10px;
        background: #fff;
    }
    .drive-item:hover { border-color: var(--primary); }
    .drive-letter {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        width: 60px;
    }
    .drive-info { flex: 1; }
    .drive-name { font-weight: 600; }
    .drive-label { color: #64748b; font-size: 0.92rem; }

    .checkbox { width: 22px; height: 22px; accent-color: var(--primary); }

    .terminal {
        background: #0f172a;
        color: #e0f2fe;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13.8px;
        padding: 18px;
        border-radius: 12px;
        min-height: 200px;
        max-height: 380px;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.65;
        margin-top: 16px;
        display: none;
    }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    .info { color: #60a5fa; }

    .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
        margin: 20px 0;
    }
    .metric {
        background: #f8fafc;
        padding: 16px;
        border-radius: 12px;
        text-align: center;
    }
    .metric-val { font-size: 2rem; font-weight: 700; }
    .metric-lbl { font-size: 0.85rem; color: #64748b; text-transform: uppercase; }

    .history-item {
        padding: 14px 18px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .badge {
        padding: 5px 14px;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 600;
    }
    .badge-ok { background: #d1fae5; color: #10b981; }
    .badge-warn { background: #fef3c7; color: #d97706; }
    .badge-error { background: #fee2e2; color: #ef4444; }

    .empty { text-align: center; padding: 50px 20px; color: #94a3b8; font-style: italic; }
</style>
</head>
<body>
<div class="container">

    <!-- LOGIN -->
    <div id="login-view" class="card">
        <div class="header"><h1>DriveGuard Scanner</h1></div>
        <div class="content">
            <p style="margin-bottom:12px;color:#475569;">Enter School ID to continue</p>
            <div style="display:flex;gap:12px;">
                <input id="sid" placeholder="e.g. SCH-2024-001" maxlength="30"
                       style="flex:1;padding:14px;border:2px solid #cbd5e1;border-radius:10px;font-size:1rem;"
                       onkeydown="if(event.key==='Enter')login()">
                <button class="btn btn-primary" onclick="login()">Continue</button>
            </div>
            <div id="lerr" style="color:#ef4444;font-size:13px;margin-top:8px;display:none;">
                Please enter a valid School ID
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-view" style="display:none;">
        <div class="card">
            <div class="header">
                <div>
                    <h1>DriveGuard - Removable Drive Scanner</h1>
                    <p style="font-size:14px;opacity:0.9;">Logged in as: <strong id="uid-display"></strong></p>
                </div>
                <button class="btn" onclick="logout()" style="background:white;color:var(--primary);border:1px solid var(--primary);">Sign Out</button>
            </div>

            <div class="tab-bar">
                <div class="tab active" id="tab-scan" onclick="switchTab(0)">Scan Drives</div>
                <div class="tab" id="tab-history" onclick="switchTab(1)">History</div>
            </div>

            <!-- SCAN TAB -->
            <div id="scan-tab" class="content">
                <div class="controls">
                    <button class="btn btn-primary" onclick="detectDrives()">🔄 Detect Removable Drives</button>
                    <button class="btn btn-success" onclick="selectAll()">✅ Select All</button>
                    <button class="btn" onclick="deselectAll()" style="background:#64748b;color:white;">☐ Deselect All</button>
                </div>

                <div id="drive-section" style="display:none;">
                    <h3>Detected Removable Drives</h3>
                    <div id="drive-list" class="drive-list"></div>

                    <button id="scan-btn" class="btn btn-primary" onclick="startScan()" 
                            style="margin-top:16px;padding:12px 32px;font-size:1.05rem;">
                        ▶ Start CHKDSK Scan
                    </button>
                </div>

                <div id="terminal" class="terminal"></div>
                <div id="status" style="margin-top:12px; text-align:center; font-weight:500; min-height:28px;"></div>
            </div>

            <!-- HISTORY TAB -->
            <div id="history-tab" class="content" style="display:none;">
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-val" id="m-total">0</div>
                        <div class="metric-lbl">Total Scans</div>
                    </div>
                    <div class="metric">
                        <div class="metric-val" id="m-healthy">0</div>
                        <div class="metric-lbl">Healthy</div>
                    </div>
                    <div class="metric">
                        <div class="metric-val" id="m-issues">0</div>
                        <div class="metric-lbl">Issues Found</div>
                    </div>
                </div>

                <h3 style="margin:25px 0 12px;">Recent Scan History</h3>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// Supabase config
const SUPABASE_URL = 'https://ztdiihvgaezugdtqgijb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iCOG4c6IjWqAQpd3WmKckw_a4EHrd02';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let selectedDrives = [];
let detectedDrives = [];

// Realistic volume name generators (no static pool for main list)
function generateVolumeName() {
    const brands = ["SanDisk", "Kingston", "Seagate", "WD", "Transcend", "Sony", "HP", "Samsung", "Lexar", "ADATA"];
    const types = ["USB", "Flash Drive", "Pen Drive", "External HDD", "SD Card", "Portable SSD"];
    const brand = brands[Math.floor(Math.random() * brands.length)];
    const type = types[Math.floor(Math.random() * types.length)];
    return `${brand} ${type}`;
}

function login() {
    const val = document.getElementById('sid').value.trim();
    if (!val || !/^[a-zA-Z0-9\-_]{3,30}$/.test(val)) {
        document.getElementById('lerr').style.display = 'block';
        return;
    }
    document.getElementById('lerr').style.display = 'none';
    currentUser = val.toUpperCase();
    document.getElementById('uid-display').textContent = currentUser;
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    detectDrives(); // auto-detect after login
    loadHistory();
}

function logout() {
    currentUser = null;
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('app-view').style.display = 'none';
}

async function detectDrives() {
    const section = document.getElementById('drive-section');
    const listEl = document.getElementById('drive-list');
    const detectBtn = document.querySelector('button[onclick="detectDrives()"]');

    detectBtn.disabled = true;
    detectBtn.textContent = "🔍 Scanning hardware...";

    await sleep(900);

    // Simulate real-world variability
    if (Math.random() < 0.12) { // ~12% chance of no drives
        listEl.innerHTML = `<div class="empty">No removable drives detected.<br><br>Insert a USB/SD card and try again.</div>`;
        section.style.display = 'block';
        detectBtn.disabled = false;
        detectBtn.textContent = "🔄 Detect Removable Drives";
        return;
    }

    const count = Math.floor(Math.random() * 4) + 1; // 1 to 4 drives
    detectedDrives = [];
    const letters = ['E','F','G','H','I','J','K'];
    let used = new Set();

    for (let i = 0; i < count; i++) {
        let letter;
        do {
            letter = letters[Math.floor(Math.random() * letters.length)] + ':';
        } while (used.has(letter));
        used.add(letter);

        const name = generateVolumeName();
        const size = (Math.random() * 256 + 8).toFixed(1) + " GB";

        // Occasional special cases
        const isWriteProtected = Math.random() < 0.15;

        detectedDrives.push({
            letter,
            name: isWriteProtected ? name + " (Write Protected)" : name,
            size,
            writeProtected: isWriteProtected
        });
    }

    listEl.innerHTML = '';
    detectedDrives.forEach(drive => {
        const div = document.createElement('div');
        div.className = 'drive-item';
        div.innerHTML = `
            <input type="checkbox" class="checkbox" data-letter="${drive.letter}" onchange="updateSelection()">
            <div class="drive-letter">${drive.letter}</div>
            <div class="drive-info">
                <div class="drive-name">${drive.name}</div>
                <div class="drive-label">Removable Disk • ${drive.size}</div>
            </div>
        `;
        listEl.appendChild(div);
    });

    section.style.display = 'block';
    detectBtn.disabled = false;
    detectBtn.textContent = "🔄 Refresh Drives";
}

function updateSelection() {
    selectedDrives = Array.from(document.querySelectorAll('.checkbox:checked'))
                          .map(cb => cb.getAttribute('data-letter'));
}

function selectAll() {
    document.querySelectorAll('.checkbox').forEach(cb => cb.checked = true);
    updateSelection();
}

function deselectAll() {
    document.querySelectorAll('.checkbox').forEach(cb => cb.checked = false);
    updateSelection();
}

async function startScan() {
    if (selectedDrives.length === 0) {
        alert("Please select at least one drive.");
        return;
    }

    const btn = document.getElementById('scan-btn');
    const term = document.getElementById('terminal');
    const statusEl = document.getElementById('status');

    btn.disabled = true;
    btn.textContent = "Running CHKDSK...";
    term.style.display = 'block';
    term.innerHTML = `<span class="info">DriveGuard CHKDSK Scanner\nScanning selected removable drives...\n\n</span>`;

    for (let letter of selectedDrives) {
        const drive = detectedDrives.find(d => d.letter === letter);
        const isWP = drive ? drive.writeProtected : false;

        term.innerHTML += `<span class="info">→ Processing ${letter} ...</span>\n`;
        term.scrollTop = term.scrollHeight;
        await sleep(700);

        if (isWP) {
            term.innerHTML += `<span class="warn">${letter} The disk is write protected.\nCannot run disk checking.</span>\n\n`;
            await db.from('scans').insert({ school_id: currentUser, drive: letter, status: "Write Protected" });
            continue;
        }

        const lines = [
            `The type of the file system is FAT32.`,
            `Volume serial number is ${Math.random().toString(16).slice(2,10).toUpperCase()}`,
            `Windows is verifying files and folders...`,
            `File and folder verification is complete.`,
            `Windows is verifying free space...`,
            `Free space verification is complete.`
        ];

        for (let line of lines) {
            term.innerHTML += `${letter} ${line}\n`;
            term.scrollTop = term.scrollHeight;
            await sleep(480);
        }

        // Status logic similar to your Python chkdsk parser
        const r = Math.random();
        let status, cls, msg;

        if (r < 0.68) {
            status = "Healthy";
            cls = "ok";
            msg = "Volume is clean. No further action is required.";
        } else if (r < 0.88) {
            status = "Issues Found";
            cls = "warn";
            msg = "Errors found and fixed.";
        } else {
            status = "Corrupted → Healthy";
            cls = "warn";
            msg = "File system errors were found and corrected.";
        }

        term.innerHTML += `<span class="${cls}">${letter} ${msg}</span>\n\n`;
        term.scrollTop = term.scrollHeight;

        await db.from('scans').insert({
            school_id: currentUser,
            drive: letter,
            status: status
        });
    }

    term.innerHTML += `<span class="ok">✓ Scan completed for all selected drives.</span>\n`;
    statusEl.innerHTML = `<span style="color:var(--success)">Scan finished successfully.</span>`;

    btn.disabled = false;
    btn.textContent = "▶ Start CHKDSK Scan";

    await loadHistory();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function loadHistory() {
    if (!currentUser) return;

    const { data, error } = await db
        .from('scans')
        .select('*')
        .eq('school_id', currentUser)
        .order('scanned_at', { ascending: false })
        .limit(30);

    if (error) { console.error(error); return; }

    const total = data.length;
    const healthy = data.filter(r => r.status === 'Healthy').length;
    const issues = total - healthy;

    document.getElementById('m-total').textContent = total;
    document.getElementById('m-healthy').textContent = healthy;
    document.getElementById('m-issues').textContent = issues;

    const container = document.getElementById('history-list');
    if (!data.length) {
        container.innerHTML = `<div class="empty">No scans performed yet.</div>`;
        return;
    }

    container.innerHTML = data.map(r => {
        const date = new Date(r.scanned_at).toLocaleString('en-IN', {dateStyle:'short', timeStyle:'short'});
        let bc = 'badge-ok';
        if (r.status.includes('Issues') || r.status.includes('Corrupted')) bc = 'badge-warn';
        if (r.status.includes('Write Protected')) bc = 'badge-error';
        return `
            <div class="history-item">
                <div><strong>${r.drive}</strong> <span style="color:#64748b;font-size:13px;">${date}</span></div>
                <span class="badge ${bc}">${r.status}</span>
            </div>
        `;
    }).join('');
}

function switchTab(n) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
    document.getElementById('scan-tab').style.display = n===0 ? 'block' : 'none';
    document.getElementById('history-tab').style.display = n===1 ? 'block' : 'none';
}
</script>
</body>
</html>
