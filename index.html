<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Check Utility</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            width: 300px;
        }
        footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Disk Check Utility</h1>
            <input type="text" id="filter-status" placeholder="Filter by status">
            <input type="text" id="filter-drive" placeholder="Filter by drive letter">
            <button id="apply-filters">Apply Filters</button>
        </header>
        <main>
            <div class="card">
                <h2>Scan Results</h2>
                <p id="scan-results">Pending scan...</p>
                <button id="detailed-scan">Perform Detailed Scan</button>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Disk Check Utility. All rights reserved.</p>
        </footer>
    </div>
    <script>
        document.getElementById('detailed-scan').addEventListener('click', function() {
            // Integration with scanning functionality to be defined here
            document.getElementById('scan-results').innerText = 'Scan completed successfully!';
        });
        document.getElementById('apply-filters').addEventListener('click', function() {
            // Filtering logic to be defined here
        });
    </script>
</body>
</html>
