<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DriveGuard - CHKDSK Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root {
        --primary: #1e40af;
        --success: #10b981;
        --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #e0e7ff);
        color: #1e2937;
        min-height: 100vh;
        padding: 20px;
    }
    .container { max-width: 780px; margin: 0 auto; }
    .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        overflow: hidden;
        margin-bottom: 20px;
    }
    .header {
        background: var(--primary);
        color: white;
        padding: 1.25rem 1.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header h1 { font-size: 1.35rem; font-weight: 600; }

    .tab-bar {
        display: flex;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
    }
    .tab {
        padding: 14px 24px;
        font-weight: 500;
        cursor: pointer;
        border-bottom: 3px solid transparent;
    }
    .tab.active {
        border-bottom: 3px solid var(--primary);
        color: var(--primary);
        background: white;
    }

    .content { padding: 1.75rem; }

    .drive-list { margin: 15px 0; }
    .drive-item {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        margin-bottom: 10px;
        transition: all 0.2s;
    }
    .drive-item:hover {
        border-color: var(--primary);
        background: #f8fafc;
    }
    .drive-letter {
        font-size: 1.45rem;
        font-weight: 700;
        color: #1e40af;
        width: 50px;
    }
    .drive-info { flex: 1; }
    .drive-label { color: #64748b; font-size: 0.95rem; }

    .checkbox { width: 20px; height: 20px; accent-color: var(--primary); }

    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1e3a8a; }

    .terminal {
        background: #0f172a;
        color: #e0f2fe;
        font-family: 'Consolas', monospace;
        font-size: 13.5px;
        padding: 16px;
        border-radius: 10px;
        min-height: 180px;
        max-height: 340px;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.6;
        margin-top: 15px;
        display: none;
    }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    .info { color: #60a5fa; }

    .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin: 20px 0;
    }
    .metric {
        background: #f8fafc;
        padding: 14px 16px;
        border-radius: 10px;
        text-align: center;
    }
    .metric-val { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .metric-lbl { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

    .history-item {
        padding: 12px 16px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .badge {
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 0.82rem;
        font-weight: 600;
    }
    .badge-ok { background: #d1fae5; color: #10b981; }
    .badge-warn { background: #fef3c7; color: #d97706; }

    .empty { text-align: center; color: #94a3b8; padding: 40px 20px; font-style: italic; }
</style>
</head>
<body>
<div class="container">

    <!-- LOGIN -->
    <div id="login-view" class="card">
        <div class="header"><h1>DriveGuard Scanner</h1></div>
        <div class="content">
            <p style="margin-bottom:12px; color:#475569;">Enter your School ID</p>
            <div style="display:flex; gap:10px;">
                <input id="sid" placeholder="e.g. SCH-2024-001" maxlength="30"
                       style="flex:1; padding:14px; border:2px solid #e2e8f0; border-radius:10px; font-size:1rem;"
                       onkeydown="if(event.key==='Enter')login()">
                <button class="btn btn-primary" onclick="login()">Continue</button>
            </div>
            <div id="lerr" style="color:#ef4444; font-size:13px; margin-top:8px; display:none;">
                Please enter a valid School ID (letters, numbers, hyphens only)
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-view" style="display:none;">
        <div class="card">
            <div class="header">
                <div>
                    <h1>DriveGuard Scanner</h1>
                    <p style="font-size:14px; opacity:0.9;">Logged in as: <strong id="uid-display"></strong></p>
                </div>
                <button class="btn" onclick="logout()" 
                        style="background:white; color:#1e40af; border:1px solid #1e40af;">
                    Sign Out
                </button>
            </div>

            <!-- Tabs -->
            <div class="tab-bar">
                <div class="tab active" id="tab-scan" onclick="switchTab(0)">Scan Drives</div>
                <div class="tab" id="tab-history" onclick="switchTab(1)">History</div>
            </div>

            <!-- SCAN TAB -->
            <div id="scan-tab" class="content">
                <button id="detect-btn" class="btn btn-primary" onclick="detectDrives()" 
                        style="margin-bottom:16px;">
                    🔍 Detect Removable Drives
                </button>

                <div id="drive-section" style="display:none;">
                    <h3>Available Removable Drives</h3>
                    <p style="color:#64748b; font-size:14px; margin:8px 0 16px;">
                        Select the drives you want to scan
                    </p>

                    <div id="drive-list" class="drive-list"></div>

                    <div style="display:flex; align-items:center; gap:12px; margin-top:20px;">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;">
                            <input type="checkbox" id="select-all" class="checkbox" onchange="toggleSelectAll()">
                            <span style="font-weight:500;">Select All</span>
                        </label>
                        <button id="scan-btn" class="btn btn-primary" onclick="startScan()" 
                                style="margin-left:auto; padding:12px 28px;">
                            Start CHKDSK Scan
                        </button>
                    </div>
                </div>

                <div id="terminal" class="terminal"></div>
                <div id="status-bar" style="margin-top:12px; text-align:center; min-height:24px;"></div>
            </div>

            <!-- HISTORY TAB -->
            <div id="history-tab" class="content" style="display:none;">
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-val" id="m-total">0</div>
                        <div class="metric-lbl">Total Scans</div>
                    </div>
                    <div class="metric">
                        <div class="metric-val" id="m-healthy">0</div>
                        <div class="metric-lbl">Healthy</div>
                    </div>
                    <div class="metric">
                        <div class="metric-val" id="m-issues">0</div>
                        <div class="metric-lbl">Issues Fixed</div>
                    </div>
                </div>

                <h3 style="margin:25px 0 12px 0;">Recent Scans</h3>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== SUPABASE ====================
const SUPABASE_URL = 'https://ztdiihvgaezugdtqgijb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iCOG4c6IjWqAQpd3WmKckw_a4EHrd02';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let selectedDrives = [];
let currentDetectedDrives = [];

// Realistic removable drive names for simulation
const driveNames = [
    "USB Flash Drive",
    "SanDisk Cruzer",
    "Kingston DataTraveler",
    "External HDD",
    "Seagate Expansion",
    "WD Elements",
    "Pen Drive",
    "Transcend JetFlash",
    "SD Card Reader",
    "Sony USB Drive"
];

function login() {
    const val = document.getElementById('sid').value.trim();
    if (!val || !/^[a-zA-Z0-9\-_]{3,30}$/.test(val)) {
        document.getElementById('lerr').style.display = 'block';
        return;
    }
    document.getElementById('lerr').style.display = 'none';

    currentUser = val.toUpperCase();
    document.getElementById('uid-display').textContent = currentUser;

    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';

    // Reset scan section
    document.getElementById('drive-section').style.display = 'none';
    document.getElementById('terminal').style.display = 'none';
    loadHistory();
}

function logout() {
    currentUser = null;
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('app-view').style.display = 'none';
}

async function detectDrives() {
    const btn = document.getElementById('detect-btn');
    const section = document.getElementById('drive-section');
    const list = document.getElementById('drive-list');

    btn.disabled = true;
    btn.textContent = '🔍 Scanning for removable drives...';

    // Simulate detection time
    await sleep(1200);

    // Generate 1 to 4 random removable drives
    const count = Math.floor(Math.random() * 4) + 1;
    currentDetectedDrives = [];

    const letters = ['E','F','G','H','I','J','K'];
    let used = new Set();

    for (let i = 0; i < count; i++) {
        let letter;
        do {
            letter = letters[Math.floor(Math.random() * letters.length)] + ':';
        } while (used.has(letter));
        used.add(letter);

        const name = driveNames[Math.floor(Math.random() * driveNames.length)];
        currentDetectedDrives.push({ letter, label: name });
    }

    // Render drives
    list.innerHTML = '';
    currentDetectedDrives.forEach(drive => {
        const div = document.createElement('div');
        div.className = 'drive-item';
        div.innerHTML = `
            <input type="checkbox" class="checkbox drive-checkbox" 
                   data-drive="${drive.letter}" onchange="updateSelection()">
            <div class="drive-letter">${drive.letter}</div>
            <div class="drive-info">
                <div style="font-weight:600;">${drive.label}</div>
                <div class="drive-label">Removable Disk</div>
            </div>
        `;
        list.appendChild(div);
    });

    section.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '🔍 Detect Removable Drives Again';
}

function toggleSelectAll() {
    const checked = document.getElementById('select-all').checked;
    document.querySelectorAll('.drive-checkbox').forEach(cb => cb.checked = checked);
    updateSelection();
}

function updateSelection() {
    selectedDrives = Array.from(document.querySelectorAll('.drive-checkbox:checked'))
                          .map(cb => cb.getAttribute('data-drive'));
}

async function startScan() {
    if (selectedDrives.length === 0) {
        alert("Please select at least one drive.");
        return;
    }

    const btn = document.getElementById('scan-btn');
    const term = document.getElementById('terminal');

    btn.disabled = true;
    btn.textContent = 'Scanning...';
    term.style.display = 'block';
    term.innerHTML = `<span class="info">DriveGuard CHKDSK Scanner started...\n</span>`;

    for (let drive of selectedDrives) {
        term.innerHTML += `<span class="info">→ Scanning ${drive} ...</span>\n`;
        term.scrollTop = term.scrollHeight;
        await sleep(700);

        const lines = [
            `The type of the file system is FAT32.`,
            `Volume serial number is ${Math.random().toString(16).slice(2,10).toUpperCase()}`,
            `Windows is verifying files and folders...`,
            `File and folder verification is complete.`,
            `Windows is verifying free space...`,
            `Free space verification is complete.`
        ];

        for (let line of lines) {
            term.innerHTML += `${drive} ${line}\n`;
            term.scrollTop = term.scrollHeight;
            await sleep(550);
        }

        const healthy = Math.random() > 0.35;
        const status = healthy ? 'HEALTHY' : 'ISSUES FIXED';
        const cls = healthy ? 'ok' : 'warn';
        const msg = healthy ? 'Volume is clean. No further action required.' : 'Errors found and fixed.';

        term.innerHTML += `<span class="${cls}">${drive} ${msg}</span>\n\n`;
        term.scrollTop = term.scrollHeight;

        // Save to Supabase
        await db.from('scans').insert({
            school_id: currentUser,
            drive: drive,
            status: status
        });
    }

    term.innerHTML += `<span class="ok">✓ Scan completed successfully for all selected drives.</span>\n`;
    term.scrollTop = term.scrollHeight;

    btn.disabled = false;
    btn.textContent = 'Start CHKDSK Scan';

    await loadHistory();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function loadHistory() {
    if (!currentUser) return;

    const { data, error } = await db
        .from('scans')
        .select('*')
        .eq('school_id', currentUser)
        .order('scanned_at', { ascending: false })
        .limit(30);

    if (error) { console.error(error); return; }

    const total = data.length;
    const healthy = data.filter(r => r.status === 'HEALTHY').length;
    const issues = total - healthy;

    document.getElementById('m-total').textContent = total;
    document.getElementById('m-healthy').textContent = healthy;
    document.getElementById('m-issues').textContent = issues;

    const container = document.getElementById('history-list');
    if (data.length === 0) {
        container.innerHTML = `<div class="empty">No scans performed yet.</div>`;
        return;
    }

    container.innerHTML = data.map(r => {
        const date = new Date(r.scanned_at).toLocaleString('en-IN', { 
            dateStyle: 'short', timeStyle: 'short' 
        });
        const bc = r.status === 'HEALTHY' ? 'badge-ok' : 'badge-warn';
        return `
            <div class="history-item">
                <div><strong>${r.drive}</strong> <span style="color:#64748b; font-size:13px;">${date}</span></div>
                <span class="badge ${bc}">${r.status}</span>
            </div>`;
    }).join('');
}

function switchTab(n) {
    document.querySelectorAll('.tab').forEach((t,i) => {
        t.classList.toggle('active', i === n);
    });
    document.getElementById('scan-tab').style.display = n === 0 ? 'block' : 'none';
    document.getElementById('history-tab').style.display = n === 1 ? 'block' : 'none';
}
</script>
</body>
</html>
